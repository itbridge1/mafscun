name: Deploy Laravel to Server

on:
  push:
    branches: [UiRefactor]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - name: Configure SSH known_hosts
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_HOST }} ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOdIu7CttzeWNix4mknZEwwyFUnLusztNjj2Ur6SA+qW" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
      - name: Deploy Application
        run: |
          ssh -p 6543 -o StrictHostKeyChecking=no ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} 'bash -se' << 'EOF'
             set -eu
             if [ ! -d "${{ secrets.DEPLOY_PATH }}" ]; then
               git clone --branch UiRefactor git@github.com:itbridge1/bagmati-proscun.git "${{ secrets.DEPLOY_PATH }}"
             fi
             cd "${{ secrets.DEPLOY_PATH }}"
             git pull --ff-only origin UiRefactor
             php84 "$(command -v composer)" install --no-dev --prefer-dist --no-interaction --optimize-autoloader
             php84 artisan optimize:clear
             php84 artisan migrate --force
          EOF
